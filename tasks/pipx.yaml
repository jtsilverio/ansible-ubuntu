
- name: Set Ubuntu version variables
  set_fact:
    user_name: "{{ ansible_user }}"

- name: Install pipx
  apt:
    name: pipx
    state: present
  become: true

- name: Install pylint
  become: true
  become_user: "{{ user_name }}"
  community.general.pipx:
    name: pylint

- name: Install black
  become: true
  become_user: "{{ user_name }}"
  community.general.pipx:
    name: black

- name: Install ruff
  become: true
  become_user: "{{ user_name }}"
  community.general.pipx:
    name: ruff

- name: Install dvc with s3 support
  become: true
  become_user: "{{ user_name }}"
  community.general.pipx:
    name: 'dvc[s3]'

- name: Install PDM
  become: true
  become_user: "{{ user_name }}"
  community.general.pipx:
    name: 'pdm'

- name: config PDM to use venv
  shell: /home/{{ user_name }}/.local/bin/pdm config venv.backend venv
  become: true
  become_user: "{{ user_name }}"
  args:
    executable: /bin/zsh

- name: config PDM to install with pip
  shell: /home/{{ user_name }}/.local/bin/pdm config venv.with_pip True
  become: true
  become_user: "{{ user_name }}"
  args:
    executable: /bin/zsh

- name: change PDM venv terminal prompt to only use python version
  become: true
  become_user: "{{ user_name }}"
  shell: /home/{{ user_name }}/.local/bin/pdm config venv.prompt {python_version}
  args:
    executable: /bin/zsh