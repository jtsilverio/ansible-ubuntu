- name: install apt packages
  become: true
  package:
    name: "{{ item }}"
    state: present
  with_items:
    - gnome-tweaks
    - gnome-shell-extensions
    - gnome-shell-extension-prefs
    - htop
    - neovim
    - dconf-cli
    - r-base
    - pandoc
    - gnome-sushi
    - s-tui
    - calibre
    - qgis
    - qgis-plugin-grass
    - vlc
    - curl
    - nala

- name: install python compilation dependencies
  become: true
  package:
    name: "{{ item }}"
    state: present
  with_items:
    - libssl-dev
    - python3-tk
    - tk-dev
    - libsqlite3-dev
